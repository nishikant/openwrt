server_names_hash_bucket_size  64;
	server {

		root /data/www/;
		index index.html index.htm;
		listen 80;
		listen [::]:80;
		server_name vpn.sevalkar.com;
                listen 443 ssl;                                
                include restrict_locally;          
                ssl_certificate /etc/nginx/conf.d/_lan.crt;
                ssl_certificate_key /etc/nginx/conf.d/_lan.key;
                ssl_session_cache shared:SSL:32k;              
                ssl_session_timeout 64m;                       
                access_log off; # logd openwrt;

		location / { 
			include mime.types;
			autoindex on;

    			# Enable byte-range requests for seeking/skipping
    			proxy_set_header Range $http_range;
    			proxy_set_header If-Range $http_if_range;
    
    			# Disable gzip compression for video to prevent playback stalling (especially in Safari)
    			gzip off;

			# Allow cross-origin video playback if needed
    			add_header Access-Control-Allow-Origin *;
    
    			# Cache videos to save bandwidth
    			expires 30d;
    			add_header Cache-Control "public, no-transform";

			try_files $uri $uri/ =404;
		}

		#location ~* \.(mp4|mkv|webm|avi)$ {
			# Ensure correct MIME type handling
    		#	include mime.types;
    		#	default_type application/octet-stream;

    			# Explicitly allow byte-range seeking
    		#	proxy_set_header Range $http_range;
    		#	proxy_set_header If-Range $http_if_range;
    
    			# Enable Nginx optimal file transfer
    		#	sendfile on;
    		#	tcp_nopush on;
		#}
    		location /videos/ {
		        alias /data/sda2/videos/;

        		autoindex on;
			# autoindex_format json; # This outputs raw JSON data instead of the ugly HTML table
        		autoindex_exact_size off;
        		autoindex_localtime on;
                        proxy_set_header Range $http_range;                                                     
                        proxy_set_header If-Range $http_if_range;                                               

		        sendfile on;
        		tcp_nopush on;

		        types {
            			video/mp4 mp4;
            			video/webm webm;
            			video/x-matroska mkv;
            			video/quicktime mov;
        		}
    		}

    		location /files/ {
        		alias /data/sda2/ebooks/;

		        autoindex on;
        		autoindex_exact_size off;
        		autoindex_localtime on;

        		sendfile on;
    		}

	}

